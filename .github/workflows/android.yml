name: Debug APK CI

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clear potential Gradle corruption
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/daemon/
          rm -rf ~/.gradle/native/
          rm -rf ~/.gradle/wrapper/
          rm -rf .gradle/

      - name: Clean project
        run: ./gradlew clean

      - name: Run KMP shared tests (commonTest via jvmTest)
        run: ./gradlew :shared:jvmTest

      - name: Build debug APK with refreshed dependencies
        run: ./gradlew --refresh-dependencies :androidApp:assembleDebug

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: testers
          file: androidApp/build/outputs/apk/debug/androidApp-debug.apk
